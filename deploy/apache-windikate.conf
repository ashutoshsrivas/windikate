# =====================================================================
# Windikate · Apache vhost · reverse proxies to the analysis-app
# =====================================================================
# Path map at https://<host>/ :
#   /phpmyadmin    → /usr/share/phpmyadmin (PHP, served locally)
#   /api/*         → Express  on :4000
#   /files/*       → Express  on :4000  (uploaded decks)
#   anything else  → Next.js  on :3000  (analysis app)
#
# Port 80 redirects everything to port 443 (HSTS preload-ready).
# Port 443 uses /etc/ssl/windikate/{fullchain.pem,privkey.pem}, which
# deploy/ssl-bootstrap.sh provisions:
#   · self-signed by default (browser warning, but TLS works)
#   · certbot-managed once a real domain points at the box
# =====================================================================

# ---------- macro: the actual app routing block ------------------
# We define it once so the SSL vhost mirrors port 80 exactly.
<Macro WindikateProxy>
    # ----- phpMyAdmin (handled BEFORE the catch-all proxy) ----
    ProxyPass /phpmyadmin !
    ProxyPass /phpmyadmin/ !

    # ----- Express backend -----------------------------------
    ProxyPass         /api  http://127.0.0.1:4000/api
    ProxyPassReverse  /api  http://127.0.0.1:4000/api
    ProxyPass         /files http://127.0.0.1:4000/files
    ProxyPassReverse  /files http://127.0.0.1:4000/files

    # ----- Next.js (catch-all) -------------------------------
    ProxyPreserveHost On
    ProxyRequests     Off
    ProxyPass         /  http://127.0.0.1:3000/
    ProxyPassReverse  /  http://127.0.0.1:3000/

    SetEnv proxy-sendcl 1

    # WebSocket pass-through (Next.js HMR, future audio streaming)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule .* "ws://127.0.0.1:3000%{REQUEST_URI}" [P,L]

    <LocationMatch "^/(_next/static|assets)/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</Macro>

# ---------- :80 — redirect everything to HTTPS -------------------
<VirtualHost *:80>
    ServerAdmin ubuntu@localhost
    ServerName  windikate.local
    ServerAlias *

    # Let certbot solve ACME HTTP-01 challenges in-place when it runs.
    # Anything that isn't an ACME path is force-upgraded to HTTPS.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog   ${APACHE_LOG_DIR}/windikate-error.log
    CustomLog  ${APACHE_LOG_DIR}/windikate-access.log combined
</VirtualHost>

# ---------- :443 — the actual app over TLS -----------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin ubuntu@localhost
    ServerName  windikate.local
    ServerAlias *

    SSLEngine on
    SSLCertificateFile      /etc/ssl/windikate/fullchain.pem
    SSLCertificateKeyFile   /etc/ssl/windikate/privkey.pem

    # Modern TLS only. Disable old protocols & weak ciphers.
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES:!RC4
    SSLHonorCipherOrder     on

    # HSTS — 6 months. (Bump to includeSubDomains; preload once we move
    # to a real domain.)
    Header always set Strict-Transport-Security "max-age=15552000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    Use WindikateProxy

    ErrorLog   ${APACHE_LOG_DIR}/windikate-error.log
    CustomLog  ${APACHE_LOG_DIR}/windikate-access.log combined
</VirtualHost>
</IfModule>
